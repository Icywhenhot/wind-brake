plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	// Mod Menu — used only for the optional config-screen integration.
	maven { url = "https://maven.terraformersmc.com/releases" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"elytrawindbrake" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// 26.1+ ships unobfuscated, so there are no mappings: no Mojang proguard file,
	// no Yarn, and an empty Fabric intermediary. The `net.fabricmc.fabric-loom`
	// plugin (not `-remap`) consumes the game jar as-is, so there's no `mappings`
	// dependency and nothing gets remapped. The jar we produce references the real,
	// stable Mojang names of 26.2 directly. This branch is pinned to 26.2 only.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API is a HARD dependency: the server-presence handshake uses its networking
	// module (Client/ServerPlayNetworking + the CustomPayload PayloadTypeRegistry). 26.x is
	// unobfuscated, so there's no remap and Loom doesn't register `modImplementation` — plain
	// `implementation` is used and Fabric API's Gradle module metadata pulls the sub-modules
	// (fabric-networking-api-v1, …) onto the compile classpath transitively. It is declared
	// `"fabric-api": "*"` in fabric.mod.json so the user's 26.2 Fabric API build satisfies it.
	// Deliberate trade of the old "no Fabric API, widest range" stance for the server gate —
	// the jar now requires Fabric API installed.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Mod Menu is an OPTIONAL integration: we compile against its API so the config screen
	// can register, but the core mod never references it outside the entrypoint class, so it
	// stays unloaded when Mod Menu isn't installed. compileOnly means it is NOT bundled and
	// NOT a published/hard dependency (it's listed under "suggests" in fabric.mod.json).
	// 26.x is unobfuscated, so Mod Menu is consumed as-is — no `modImplementation`/remap.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	// DEV RUNTIME ONLY — load Mod Menu in runClient so the config screen can be tested in-game.
	// loom's `localRuntime` never leaks into the published jar or its metadata. (Fabric API is
	// already on the dev runtime via the modImplementation above.)
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
