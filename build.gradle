plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	// Mod Menu — used only for the optional config-screen integration.
	maven { url = "https://maven.terraformersmc.com/releases" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"elytrawindbrake" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// 26.1+ ships unobfuscated, so there are no mappings: no Mojang proguard file,
	// no Yarn, and an empty Fabric intermediary. The `net.fabricmc.fabric-loom`
	// plugin (not `-remap`) consumes the game jar as-is, so there's no `mappings`
	// dependency and nothing gets remapped. The jar we produce references the real,
	// stable Mojang names directly — which is exactly what makes one jar span 26.1–26.2.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// No Fabric API on purpose: depending only on fabric-loader keeps the jar's
	// version range as wide as possible (Fabric API bumps per MC version).

	// Mod Menu is an OPTIONAL integration: we compile against its API so the config screen
	// can register, but the core mod never references it outside the entrypoint class, so it
	// stays unloaded when Mod Menu isn't installed. compileOnly means it is NOT bundled and
	// NOT a published/hard dependency (it's listed under "suggests" in fabric.mod.json).
	// 26.x is unobfuscated, so the mod is consumed as-is — no `modImplementation`/remap.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	// DEV RUNTIME ONLY — load Mod Menu + Fabric API in runClient so the config screen can be
	// tested in-game (Mod Menu needs several Fabric API modules). loom's `localRuntime` never
	// leaks into the published jar or its metadata, so the shipped mod still hard-depends only
	// on fabric-loader. (Unobfuscated 26.x => plain localRuntime, not modLocalRuntime/remap.)
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
